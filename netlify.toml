[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  NPM_FLAGS = "--no-audit --no-fund"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # The llama.cpp runtime (binary + shared libraries) is shipped with the
  # function. The GGUF model is deliberately NOT included here: it is published
  # as a static asset and downloaded into the execution environment on demand.
  included_files = ["runtime/llama/**"]

# API routing: every /api/* request is handled by the single serverless function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Static assets and the model are served by the CDN.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback (must stay last so it never shadows /api/* or static assets).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
